<figure class="map spine-map spine-hero">
<svg viewBox="0 0 560 520" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">An old-growth spine, built woodlot by woodlot</title>
<desc id="map-desc">A watershed drawn as a map, north at the top. Streams rise in cool headwaters in the north and branch down to an outlet in the south, with ridges between the valleys. A spine of retained forest follows the streams, widest along the main river, and crosses two ridges to close loops. Nine woodlots join one at a time, starting in the middle and spreading north, south, east and west; each one commits its stretch of the spine. A century on, the retained spine has grown old. A dashed climate line that marks today's valley conditions has moved north and upslope, and the spine connects the warm valley floor to the cooler headwaters.</desc>

<figcaption>Illustration, not a real site. The spine follows rivers and crosses ridges; numbers show the order woodlots join; the green deepens as the retained forest ages; the dashed line is a climate band moving upslope.</figcaption>
