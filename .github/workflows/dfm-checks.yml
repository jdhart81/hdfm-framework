name: DFM implementation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Vendored dfm-core matches packages/dfm-core
        run: |
          # The version comes from packages/dfm-core, so a release bump cannot skip this check.
          V=$(node -p "require('../packages/dfm-core/package.json').version")
          test -f "vendor/viridis-dfm-core-$V.tgz" || { echo "web/vendor has no dfm-core $V tarball"; exit 1; }
          grep -q "file:vendor/viridis-dfm-core-$V.tgz" package.json || { echo "web/package.json does not use dfm-core $V"; exit 1; }
          mkdir -p /tmp/vendored /tmp/packed
          tar -xzf "vendor/viridis-dfm-core-$V.tgz" -C /tmp/vendored
          (cd ../packages/dfm-core && npm pack --pack-destination /tmp >/dev/null)
          tar -xzf "/tmp/viridis-dfm-core-$V.tgz" -C /tmp/packed
          diff -r /tmp/vendored /tmp/packed
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run analyze -- examples/fictional-watershed.geojson /tmp/dfm-assessment.json 50 6
  dfm-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dfm-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/dfm-core/package-lock.json
      - run: npm ci
      - run: npm test
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build and smoke-test the site container
        run: |
          docker build -t dendriticforest-site:ci .
          docker run -d --name site -p 8080:8080 dendriticforest-site:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Keep the woods working'
          curl -fsS http://127.0.0.1:8080/unbroken/ | grep -q 'One unbroken forest'
          curl -sSI http://127.0.0.1:8080/ | grep -qi "content-security-policy: default-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/missing)" = 404
          docker rm -f site
  research-implementation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hdfm-framework
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
