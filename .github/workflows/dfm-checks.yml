name: DFM implementation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Vendored dfm-core matches packages/dfm-core
        run: |
          mkdir -p /tmp/vendored /tmp/packed
          tar -xzf vendor/viridis-dfm-core-0.1.0.tgz -C /tmp/vendored
          (cd ../packages/dfm-core && npm pack --pack-destination /tmp >/dev/null)
          tar -xzf /tmp/viridis-dfm-core-0.1.0.tgz -C /tmp/packed
          diff -r /tmp/vendored /tmp/packed
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run analyze -- examples/fictional-watershed.geojson /tmp/dfm-assessment.json 50 6
  dfm-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dfm-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/dfm-core/package-lock.json
      - run: npm ci
      - run: npm test
  research-implementation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hdfm-framework
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
